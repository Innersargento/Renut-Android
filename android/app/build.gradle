plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.renut.android'
    compileSdk 35
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'org.renut.android'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.4.0-xenos-experimental'
        ndk { abiFilters 'arm64-v8a' }
        // -PrenutPgo=gen builds the instrumented APK; -PrenutPgo=use -PrenutPgoProfile=<.profdata>
        // builds with the merged profile (tools/pgo.py).
        def pgoArgs = []
        if (project.hasProperty('renutPgo')) {
            pgoArgs << "-DRENUT_PGO=${project.property('renutPgo')}".toString()
            if (project.hasProperty('renutPgoProfile'))
                pgoArgs << "-DRENUT_PGO_PROFILE=${project.property('renutPgoProfile')}".toString()
        }
        externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_shared', '-DCMAKE_JOB_POOLS=compile_pool=4', '-DCMAKE_JOB_POOL_COMPILE=compile_pool'
            pgoArgs.each { arguments it }
        } }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    sourceSets.main.java.srcDir '../../thirdparty/rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java'
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui:1.9.0'
    implementation 'androidx.compose.foundation:foundation:1.9.0'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
}
