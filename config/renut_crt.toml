# CRT functions the SDK implements natively (rex/kernel/crt): codegen renames each address to
# rexcrt_<Name>, leaves it out of the recompiled code and the SDK's host implementation runs instead
# of a recompiled byte loop. Only memory and string functions are mapped here. Left out on purpose:
#   - the heap group (RtlAllocateHeap, RtlFreeHeap, RtlSizeHeap, RtlReAllocateHeap, at 0x8223F478,
#     0x8223FD48, 0x82240200, 0x82717428): all-or-nothing, it needs the ReXCRT heap started after the
#     XEX loads (rex::kernel::crt::InitHeap) and the rexcrt_heap_enable cvar, and it moves every
#     allocation of the game into a 256 MB o1heap;
#   - wcscmp, wcsncmp, wcschr: the SDK reads the guest's big-endian UTF-16 as host int16, so the sign of the result
#     is wrong and wcschr never finds a character (tried 18/10 with the geb project's list);
#   - the file group (CreateFileA 0x82715378, ReadFile 0x827156E0, WriteFile 0x82715E50, ...): handle
#     based and tied to the kernel's XFile objects, not measured.
# Addresses are this build's (default.xex of the European disc); each was checked to be a function start
# in generated/android and, for strchr and strlen, by its body.
[rexcrt]
# memory
memcpy = 0x82BB4510
memmove = 0x82BB2C70
memset = 0x82BB4A40
memchr = 0x82BB1D20
XMemCpy = 0x822A2930
XMemSet = 0x8224B658
XMemSet128 = 0x82257B18
memcpy_s = 0x82BB0E00
memmove_s = 0x82BB0ED8

# string
strncmp = 0x82BB12D0
strncpy = 0x821E7F10
strchr = 0x82BB0DC0
strstr = 0x82BB1D60
strrchr = 0x82BB61C0
strcpy_s = 0x821F4BC0
lstrlenA = 0x82BCD2F0
lstrcmpiA = 0x82BCD260
_stricmp = 0x82BB6220  # case-insensitive compare, 73 call sites

# wide string: a lhz loop returning the count of halfwords (144 call sites)
wcslen = 0x82BB1798
wcsstr = 0x82BB3508  # compares halfwords for equality only, so the guest's big-endian text is fine
wcsncpy = 0x82BB4068  # copies halfwords as they are
