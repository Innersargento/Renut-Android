# Library routines compiled into the XEX that the SDK replaces with host functions (shims, RexGlue 0.11:
# docs/site/pages/runtime/shims.md, `rexglue list shim`). Codegen names each address rexshim_<Name>, emits no
# body for it, and every call runs the SDK's host function instead of a recompiled byte loop.
#
# Left out on purpose:
#   - the heap group (RtlAllocateHeap 0x8223F478, RtlFreeHeap 0x8223FD48, RtlSizeHeap 0x82240200,
#     RtlReAllocateHeap 0x82717428): all four or none, and it moves every allocation of the game into the
#     SDK's TLSF shim heap (runtime.heap_size_mb, 256 MB first segment, grows by 64 MB). The heap guards in
#     guest/game_fixes.cpp (meInternalFree, sub_8223FD48) read the game heap's own block headers and table,
#     which the shim heap does not have: enabling it means rewriting those first, then a device test.
#     (reNut PC and reblue both run with it.)
#   - the file group (CreateFileA 0x82715378, ReadFile 0x827156E0, WriteFile 0x82715E50, ...): the I/O goes
#     through the SDK's filesystem either way, and nothing here was measured to be slow; reNut PC (without
#     CloseHandle) and reblue use it.
#   - atan2: not found in this build (the routine next to where reNut PC's would be is tan).
# The wide string group, wrong in RexGlue 0.10 (big-endian halfwords read as host ones), is fixed in 0.11
# (SDK commit 53bfe5d8) and on since then.
#
# Addresses are this build's (default.xex of the European disc). Each is a function start in
# generated/android whose guest code was read there (the disassembly comments) before it was listed; the new
# 0.11 entries were found by their place next to the routines reNut PC (TU3) lists and checked by body.
[shim]
# memory
memcpy = 0x82BB4510
memmove = 0x82BB2C70
memset = 0x82BB4A40
memchr = 0x82BB1D20
XMemCpy = 0x822A2930
XMemSet = 0x8224B658
XMemSet128 = 0x82257B18
memcpy_s = 0x82BB0E00
memmove_s = 0x82BB0ED8

# string
strncmp = 0x82BB12D0
strncpy = 0x821E7F10
strchr = 0x82BB0DC0
strstr = 0x82BB1D60
strrchr = 0x82BB61C0
strcpy_s = 0x821F4BC0
lstrlenA = 0x82BCD2F0
lstrcmpiA = 0x82BCD260
_stricmp = 0x82BB6220  # case-insensitive compare, 73 call sites

# wide string
wcslen = 0x82BB1798  # a lhz loop returning the count of halfwords, 144 call sites
wcsstr = 0x82BB3508
wcsncpy = 0x82BB4068
wcscmp = 0x82261560  # lhz pairs until they differ, returns -1, 0 or 1; 44 call sites
wcsncmp = 0x82BB3960  # counted lhz compare, returns the difference; 20 call sites
wcschr = 0x82BB4028  # lhz loop against r4's low halfword, the match or null; 12 call sites
wcsncpy_s = 0x82BB3CA0  # (dst, size, src, count), count -1 truncates, EINVAL 22 / ERANGE 34; 28 call sites

# math
atof = 0x82BB18F0  # skips the C-locale spaces, then converts; 1 call site
